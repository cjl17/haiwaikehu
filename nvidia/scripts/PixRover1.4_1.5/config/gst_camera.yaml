cameras:
  camera0:
    camera_id: 0
    pub_h265: true
    pub_jpeg: false
    pub_rgb: true
    is_aligned: true
    # src
    device: "/dev/video0"
    width: 3840
    height: 2160
    framerate: 30
    format: "UYVY"
    frame_id: "camera0/camera_link"
    camera_name: "camera0"
    camera_info_url: "file://${ROS_HOME}/../pix/parameter/sensor_kit/robobus_sensor_kit_description/intrinsic_parameters/camera0_params.yaml"
    # output h265
    h265_topic_name: "/electronic_rearview_mirror/front_3mm/camera_compressed_image"
    h265_width: 3840
    h265_height: 2160
    h265_framerate: 10
    h265_bitrate: 12000000
    h265_control_rate: 1
    h265_peak_bitrate: 5000000
    h265_iframeinterval: 10
    h265_idrinterval: 10
    # output jpeg
    jpeg_topic_name: "/electronic_rearview_mirror/front_3mm/camera_image_jpeg"
    jpeg_width: 960
    jpeg_height: 540
    jpeg_framerate: 30
    jpeg_file_prefix: "front_3mm"
    jpeg_udp_ip: "192.168.1.104" 
    jpeg_udp_port: 5001
    # output rgb
    dewarper_framerate: 10
    camera_info_topic_name: "/sensing/camera/front_3mm/camera_info"
    rgb_topic_name: "/sensing/camera/front_3mm/image_raw"
    rgb_width: 3840
    rgb_height: 2160
    rgb_framerate: 10
    rgb_nvunixfdsink_path_1: "/tmp/camera_front_3mm_rgba_sink_1"
    jetpack_version: "6.2"
