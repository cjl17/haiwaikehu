[global]
# 使用链路层通信（L2，EtherType 0x88F7）
network_transport              L2

# 延迟机制（End-to-End）
delay_mechanism               E2E

# 与主时钟相同的域号
domainNumber                  0

# 同步报文、announce报文发送频率建议与主设备一致
  # 每秒8次
  # 每2秒一次
  # 每1秒发送Delay_Req
logSyncInterval               -3     
logAnnounceInterval           1        
logMinDelayReqInterval        0        

# 设置优先级较低，避免参与主时钟竞争
priority1                     248
priority2                     248

# 时钟质量声明（永远 Slave）
# 精度未知
# 抖动未知
# 内部自由运行    
clockClass                    255
clockAccuracy                 0xFE     
offsetScaledLogVariance       0xFFFF  
timeSource                    0xA0     

# 如果误差过大就直接跳变调整
step_threshold                5.0

# 输出调试信息到控制台
verbose                       1

# 明确为 slaveOnly（从不选为主时钟）
slaveOnly                    1
