[global]
# 使用L2链路层通信（EtherType 0x88F7）
network_transport              L2

# 延迟机制：端到端（End-to-End）
delay_mechanism               E2E

# 设置与雷达一致的域号
domainNumber                  0

# 建议同步频率（越小越频繁）
  # 8Hz (2^-3 = 1/8s) 
  # 2s  # 1s
logSyncInterval               -3       
logAnnounceInterval           1        
logMinDelayReqInterval        0       

# 主时钟优先级（数值越小越优先） # 默认是128，越低越优先
priority1                     64        
priority2                     64

# 时钟质量声明（普通 Master）
# 普通时钟，不是高精度
# 精度未知
# 抖动未知
 # 例如 NTP / 系统时间     
clockClass                    128      
clockAccuracy                 0xFE     
offsetScaledLogVariance       0xFFFF   
timeSource                    0xA1     

# 允许时间跳变阈值，超过则step（秒）
step_threshold                5.0

# 日志等级（可选）
verbose                       1

# 可选：锁定 master 角色，避免被 preempt（不建议除非你只允许自己当 master）
# assume_two_step              1
# masterOnly                  1

# 仅限调试用：忽略BMCA规则（让自己强制为主时钟）
# gmCapable                   1

# 新增：发送时间戳等待超时时间（毫秒）
tx_timestamp_timeout           300
